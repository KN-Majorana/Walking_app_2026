workflows:
  # ──────────────────────────────────────────────
  # 署名なし IPA（Apple Developer アカウント不要）
  #   生成物 build/ios/iphoneos/Runner.ipa は「未署名」です。
  #   App Store / TestFlight には出せません。実機に入れるには
  #   Sideloadly / AltStore 等で再署名してサイドロードします。
  # ──────────────────────────────────────────────
  ios-unsigned:
    name: iOS Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter pub get
        script: |
          flutter pub get
      - name: Generate iOS config (config only, no signing)
        script: |
          # ios/Podfile はリポジトリのものを使用。Generated.xcconfig 等のみ生成。
          flutter build ios --release --no-codesign --config-only
      - name: Pod install
        script: |
          cd ios
          pod install --repo-update
      - name: Build unsigned .app and package as .ipa
        script: |
          set -e
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          rm -rf Payload Runner.ipa
          mkdir -p Payload
          mv Runner.app Payload/
          zip -r Runner.ipa Payload >/dev/null
          echo "生成: $(pwd)/Runner.ipa"
    artifacts:
      - build/ios/iphoneos/Runner.ipa
      - /tmp/xcodebuild_logs/*.log
